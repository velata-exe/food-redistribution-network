<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-body">
  <div class="auth-bg"></div>

  <div class="auth-card">
    <h1 class="auth-title">Login</h1>
    <p class="auth-subtitle">Permanent users only</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash">
          {% for category, msg in messages %}
            <div class="flash-{{ category }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form class="auth-form" method="POST" action="/login">
      <label class="auth-label">Username</label>
      <input class="auth-input" type="text" name="username" placeholder="Enter username" required>

      <label class="auth-label">Password</label>
      <input class="auth-input" type="password" name="password" placeholder="Enter password" required>

      <button class="auth-button" type="submit">Login</button>
    </form>

    <div class="auth-footer">
      <a class="auth-link" href="/signup">Create account</a>
      <span class="auth-sep">•</span>
      <a class="auth-link" href="/">Back</a>
    </div>
  </div>
</body>
</html>
